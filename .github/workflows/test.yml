name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $file = $_.FullName
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors)
            foreach ($error in $parseErrors) {
              Write-Error "${file}: $($error.Message)"
              $failures++
            }
          }
          if ($failures -gt 0) { throw "$failures PowerShell parse error(s)" }

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
